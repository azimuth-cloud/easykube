name: Tox unit tests

on:
  workflow_call:
    inputs:
      ref:
        type: string
        description: The ref to build.
        required: true

jobs:
  tox:
    name: Tox unit tests and linting
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0

      - name: Run tox
        run: uv run --locked tox
        env:
          DIFF_COVER_COMPARE_BRANCH: origin/${{ github.base_ref || github.event.repository.default_branch }}

      - name: Add coverage reports to the job summary
        run: |
          cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"
          echo "# Coverage" >> "$GITHUB_STEP_SUMMARY"
          uv run --locked coverage report --data-file .coverage --format=markdown >> "$GITHUB_STEP_SUMMARY"
